name: CI

on:
    push:
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: cachix/install-nix-action@v27
              with:
                  nix_path: nixpkgs=channel:nixos-unstable

            - name: Build
              run: nix-shell --run "mkdir -p build && cd build && cmake -G Ninja .. && ninja"

            - name: Test
              run: nix-shell --run "cd build && ctest --output-on-failure"
